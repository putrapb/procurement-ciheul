services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgresql://procurement:procurement@db:5432/procurement
      SECRET_KEY: docker-dev-key
      ALLOWED_HOSTS: "*"
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
