{% extends "base.html" %}
{% block title %}Terbitkan PO – Procurement{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;margin:auto;">
  <div class="card-body text-center py-5">
    <i class="bi bi-receipt fs-1 text-primary"></i>
    <h2 class="h5 mt-3">Terbitkan PO dari Quotation ini?</h2>
    <p class="text-muted">Vendor: <strong>{{ quotation.rfq_vendor.vendor }}</strong></p>
    <form method="post" class="d-flex gap-2 justify-content-center">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary">Ya, Terbitkan PO</button>
      <a href="{% url 'rfq_detail' quotation.rfq_vendor.rfq.pk %}" class="btn btn-outline-secondary">Batal</a>
    </form>
  </div>
</div>
{% endblock %}
