{% extends "base.html" %}
{% block title %}Buat RFQ – Procurement{% endblock %}
{% block content %}
<h1 class="h4 mb-4">Buat RFQ untuk {{ pr.number }}</h1>
<div class="card" style="max-width:600px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Batas Waktu Penawaran</label>
        <input type="date" name="due_date" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Pilih Vendor <span class="text-danger">*</span></label>
        {% for v in vendors %}
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="vendor_ids" value="{{ v.pk }}" id="v{{ v.pk }}">
          <label class="form-check-label" for="v{{ v.pk }}">{{ v.code }} – {{ v.name }}</label>
        </div>
        {% endfor %}
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Buat RFQ</button>
        <a href="{% url 'pr_detail' pr.pk %}" class="btn btn-outline-secondary">Batal</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
